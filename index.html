<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lander</title>
  <style>
    body {
      margin: 0;
      background: #101116;
      color: #f3f4f8;
      font-family: sans-serif;
    }

    main {
      width: min(621px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    img {
      display: block;
      width: 100%;
      aspect-ratio: 621 / 513;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0 0 0.5rem;
    }

    p {
      color: #a4a8b8;
      margin: 0 0 1.5rem;
    }

    .frame {
      width: 100%;
      max-width: 621px;
    }

    .frame iframe {
      width: 100%;
      aspect-ratio: 621 / 513;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img src="Screenshot.png" alt="Screenshot of Lander">

    <h1>Lander</h1>
    <p>
      Guide your lander safely to the landing.
    </p>

    <div class="frame">
      <iframe
        src="https://www.lexaloffle.com/bbs/widget.php?pid=lander_game"
        title="Play Lander"
        allowfullscreen
      ></iframe>
    </div>
  </main>
</body>
</html>
